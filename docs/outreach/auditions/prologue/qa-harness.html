<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IR triangle fragment QA harness</title>
<style>
/* Palette copied verbatim from docs/outreach/auditions/proof-atlas.html. */
:root {
  --paper:        #EDF0F2;
  --surface:      #FAFBFC;
  --surface-2:    #F3F6F8;
  --surface-sunk: #E7ECEF;
  --ink:          #14202A;
  --ink-2:        #3E4E5A;
  --ink-3:        #5F6F7B;
  --rule:         #D3DBE1;
  --rule-2:       #BCC7CE;
  --accent:       #146C9B;
  --accent-text:  #0E5478;
  --accent-tint:  #E3EEF5;
  /* the two categorical data slots, in fixed order: stiffness 100, then stiffness 10.
     Validated for lightness band, chroma, CVD separation and contrast on both surfaces. */
  --keep:         #146C9B;
  --die:          #B0592E;
  --st-proved:     #2F6B4F;
  --st-sketch:     #8A6A21;
  --st-conjecture: #4650A2;
  --st-hold:       #8A4F6D;
  --st-refuted:    #9B3535;
  --shadow: 0 1px 2px rgba(20, 32, 42, .06), 0 8px 24px rgba(20, 32, 42, .05);

  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --sans:  "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono:  "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:        #0D1418;
    --surface:      #141D23;
    --surface-2:    #1B262D;
    --surface-sunk: #101A20;
    --ink:          #DDE7ED;
    --ink-2:        #A3B3BD;
    --ink-3:        #78888F;
    --rule:         #27343C;
    --rule-2:       #3B4B55;
    --accent:       #6FB0D8;
    --accent-text:  #96C8E6;
    --accent-tint:  #16303F;
    --keep:         #4695C6;
    --die:          #CE7444;
    --st-proved:     #6FB98A;
    --st-sketch:     #C7A24F;
    --st-conjecture: #9098DE;
    --st-hold:       #C58AAA;
    --st-refuted:    #D97A7A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  --paper:        #0D1418;
  --surface:      #141D23;
  --surface-2:    #1B262D;
  --surface-sunk: #101A20;
  --ink:          #DDE7ED;
  --ink-2:        #A3B3BD;
  --ink-3:        #78888F;
  --rule:         #27343C;
  --rule-2:       #3B4B55;
  --accent:       #6FB0D8;
  --accent-text:  #96C8E6;
  --accent-tint:  #16303F;
  --keep:         #4695C6;
  --die:          #CE7444;
  --st-proved:     #6FB98A;
  --st-sketch:     #C7A24F;
  --st-conjecture: #9098DE;
  --st-hold:       #C58AAA;
  --st-refuted:    #D97A7A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.62;
  font-feature-settings: "kern" 1;
  overflow-x: clip;
}
a { color: var(--accent-text); text-decoration-thickness: 1px; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.22; }
p { margin: 0; }
.eyebrow { font-family: var(--sans); font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.mono { font-family: var(--mono); font-size: .88em; }
.btn { font-family: var(--sans); font-size: 13.5px; font-weight: 500; padding: .45rem .85rem; border-radius: 3px; cursor: pointer; border: 1px solid var(--rule-2); background: var(--surface); color: var(--ink); transition: background .12s ease, border-color .12s ease; }
.btn:hover { border-color: var(--accent); background: var(--accent-tint); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.btn-primary:hover { background: var(--accent-text); border-color: var(--accent-text); }
#qa-host { max-width: 1180px; min-width: 0; margin: 0 auto; padding: 2rem 1.25rem 5rem; }
.qa-fragment { min-width: 0; }
.stop { max-width: 46rem; min-width: 0; scroll-margin-top: 1rem; margin-bottom: 5rem; }
.stop-head { border-bottom: 2px solid var(--ink); padding-bottom: .9rem; margin-bottom: 1.4rem; }
.stop-head .plate { font-family: var(--mono); font-size: 12px; color: var(--ink-3); letter-spacing: .04em; }
.stop h2 { font-size: clamp(1.5rem, 1.15rem + 1.5vw, 2.05rem); margin-top: .35rem; }
.lede { font-size: 1.09em; color: var(--ink); margin-top: .9rem; }
.body p + p { margin-top: .9rem; }
.body { color: var(--ink-2); }
.body strong { color: var(--ink); font-weight: 600; }
.eq { margin: 1.4rem 0; padding: 1rem 1.1rem; background: var(--surface); border: 1px solid var(--rule); overflow-x: auto; }
.eq .eq-label { font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin-bottom: .35rem; }
.eq .eq-note { font-family: var(--sans); font-size: 12.5px; color: var(--ink-3); margin-top: .6rem; }
.note-box { margin: 1.2rem 0; padding: .85rem 1rem; border-left: 3px solid var(--rule-2); background: var(--surface-2); font-family: var(--sans); font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.chart-title { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--ink); }
.chart-sub { font-family: var(--sans); font-size: 11.5px; line-height: 1.45; color: var(--ink-3); margin-top: .18rem; }
figure { margin: 1.6rem 0; }
figcaption { font-family: var(--sans); font-size: 12.5px; line-height: 1.5; color: var(--ink-3); margin-top: .6rem; }
figcaption b { color: var(--ink-2); font-weight: 600; }
blockquote.quote { margin: 1.5rem 0; padding: 0 0 0 1.1rem; border-left: 2px solid var(--rule-2); font-style: italic; color: var(--ink); }
blockquote.quote footer { font-style: normal; margin-top: .5rem; }
@media (max-width: 480px) { #qa-host { padding-inline: .8rem; } }
</style>
<script>
var __qaTheme = new URLSearchParams(location.search).get('theme');
if (__qaTheme === 'light' || __qaTheme === 'dark') document.documentElement.setAttribute('data-theme', __qaTheme);
window.__qa = { errors: [], warnings: [], fragments: [], libraries: { mathjax: 'pending', three: 'pending' }, ready: false };
(function () {
  var qa = window.__qa;
  var nativeError = console.error.bind(console);
  console.error = function () {
    var message = Array.prototype.map.call(arguments, function (v) {
      if (v instanceof Error) return v.stack || v.message;
      try { return typeof v === 'string' ? v : JSON.stringify(v); } catch (_) { return String(v); }
    }).join(' ');
    qa.errors.push({ kind: 'console.error', message: message });
    nativeError.apply(console, arguments);
  };
  window.onerror = function (message, source, lineno, colno, error) {
    qa.errors.push({ kind: 'window.onerror', message: String(message), source: source || '', line: lineno || 0, column: colno || 0, stack: error && error.stack || '' });
  };
  window.addEventListener('unhandledrejection', function (event) {
    var reason = event.reason;
    qa.errors.push({ kind: 'unhandledrejection', message: reason && (reason.stack || reason.message) || String(reason) });
  });
  window.addEventListener('error', function (event) {
    if (event.target && event.target !== window) {
      qa.warnings.push({ kind: 'resource-error', source: event.target.src || event.target.href || event.target.tagName });
    }
  }, true);
})();
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  svg: { fontCache: 'global' },
  startup: { typeset: false }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"
        onload="window.__qa.libraries.mathjax='loaded'"
        onerror="window.__qa.libraries.mathjax='unavailable'"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"
        onload="window.__qa.libraries.three='loaded'"
        onerror="window.__qa.libraries.three='unavailable'"></script>
</head>
<body>
<main id="qa-host"></main>
<script>
(async function () {
  var qa = window.__qa;
  var host = document.getElementById('qa-host');
  var windowKeysBeforeFragments = Object.getOwnPropertyNames(window);
  var names = (new URLSearchParams(location.search).get('frag') || 'frag-gw.html')
    .split(',').map(function (s) { return s.trim(); }).filter(Boolean);

  async function executeScripts(scope) {
    var scripts = Array.prototype.slice.call(scope.querySelectorAll('script'));
    for (var i = 0; i < scripts.length; i++) {
      var old = scripts[i];
      var fresh = document.createElement('script');
      for (var j = 0; j < old.attributes.length; j++) {
        fresh.setAttribute(old.attributes[j].name, old.attributes[j].value);
      }
      if (old.src) {
        fresh.async = false;
        await new Promise(function (resolve) {
          fresh.addEventListener('load', resolve, { once: true });
          fresh.addEventListener('error', resolve, { once: true });
          old.parentNode.replaceChild(fresh, old);
        });
      } else {
        fresh.textContent = old.textContent;
        old.parentNode.replaceChild(fresh, old);
      }
    }
  }

  for (var i = 0; i < names.length; i++) {
    var name = names[i];
    try {
      var response = await fetch(name, { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status + ' for ' + name);
      var mount = document.createElement('div');
      mount.className = 'qa-fragment';
      mount.dataset.fragment = name;
      mount.innerHTML = await response.text();
      host.appendChild(mount);
      await executeScripts(mount);
      qa.fragments.push({ name: name, status: 'loaded' });
    } catch (error) {
      qa.errors.push({ kind: 'fragment-load', message: error.stack || error.message || String(error), fragment: name });
      qa.fragments.push({ name: name, status: 'failed' });
    }
  }

  try {
    if (window.MathJax && MathJax.startup && MathJax.startup.promise) await MathJax.startup.promise;
    if (window.MathJax && MathJax.typesetPromise) {
      await MathJax.typesetPromise([host]);
      qa.libraries.mathjax = 'loaded';
    } else {
      qa.warnings.push({ kind: 'library-unavailable', source: 'MathJax' });
      qa.libraries.mathjax = 'unavailable';
    }
  } catch (error) {
    qa.errors.push({ kind: 'mathjax', message: error.stack || error.message || String(error) });
  }
  qa.libraries.three = window.THREE ? 'loaded' : 'unavailable';
  qa.windowKeysAdded = Object.getOwnPropertyNames(window).filter(function (key) {
    return windowKeysBeforeFragments.indexOf(key) === -1;
  });
  qa.ready = true;
  window.dispatchEvent(new CustomEvent('qa-ready'));
})();
</script>
</body>
</html>

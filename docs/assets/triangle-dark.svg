<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" role="img" aria-labelledby="irt">
<title id="irt">The 1D lattice infrared triangle. Corner A, asymptotic symmetry: PROVED for general compact G. Corner B, memory effect: PROVED, conditional on D26 and D27. Corner C, soft theorem: CONJECTURE in general, exact and PROVED at n equals 2. Directed edges: A to C is CONJECTURE, C to B is SKETCH blocked on lemma ACE-LD, B to A is SKETCH awaiting the moment map.</title>
<defs>
<marker id="t-conj" viewBox="0 0 10 10" refX="9.4" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0.4,0.7 L9.4,5 L0.4,9.3 L2.4,5 Z" fill="#d95926"/></marker>
<marker id="t-sk" viewBox="0 0 10 10" refX="9.4" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0.4,0.7 L9.4,5 L0.4,9.3 L2.4,5 Z" fill="#3987e5"/></marker>
<clipPath id="t-cut"><path clip-rule="evenodd" d="M0,0 H900 V668 H0 Z M280,76 h340 v150 h-340 Z M30,396 h290 v150 h-290 Z M580,396 h290 v150 h-290 Z"/></clipPath>
</defs>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<polygon points="450,151 175,471 725,471" fill="rgba(255,255,255,0.032)" clip-path="url(#t-cut)"/>
<line x1="382.9" y1="229.0" x2="242.8" y2="392.2" stroke="#d95926" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#t-conj)"/>
<line x1="325" y1="471" x2="575" y2="471" stroke="#3987e5" stroke-width="2" stroke-linecap="round" marker-end="url(#t-sk)"/>
<line x1="657.9" y1="393.0" x2="517.8" y2="229.8" stroke="#3987e5" stroke-width="2" stroke-linecap="round" marker-end="url(#t-sk)"/>
<text x="450" y="36" font-size="19" font-weight="600" fill="#ffffff" text-anchor="middle">The 1D lattice infrared triangle</text>
<rect x="280" y="76" width="340" height="150" rx="10" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="600" y="130" font-size="54" font-weight="700" fill="rgba(255,255,255,0.10)" text-anchor="end">A</text><circle cx="306" cy="98" r="4.4" fill="#0ca30c"/><text x="318" y="102" font-size="11" font-weight="600" text-anchor="start" letter-spacing="0.6"><tspan fill="#c3c2b7">PROVED</tspan><tspan dx="5" fill="#898781" font-weight="400">· general compact G</tspan></text><text x="302" y="131" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">Asymptotic symmetry</text><text x="302" y="159" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="start"><tspan font-size="13.5">A</tspan><tspan dy="4.05" font-size="10.8">eff</tspan><tspan dx="3.91" dy="-4.05" font-size="13.5">= G / N</tspan><tspan dy="4.05" font-size="10.8">α</tspan><tspan dx="15.66" dy="-4.05" font-size="13.5">·    [ω</tspan><tspan dy="4.05" font-size="10.8">α</tspan><tspan dy="-4.05" font-size="13.5">] ∈ H</tspan><tspan dy="-5.67" font-size="10.8">2</tspan><tspan dy="5.67" font-size="13.5">(H</tspan><tspan dy="4.05" font-size="10.8">α</tspan><tspan dy="-4.05" font-size="13.5">, U(1))</tspan></text><text x="302" y="183" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">charges on the MPS manifold · kinks: double cosets</text>
<rect x="30" y="396" width="290" height="150" rx="10" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="300" y="450" font-size="54" font-weight="700" fill="rgba(255,255,255,0.10)" text-anchor="end">C</text><circle cx="56" cy="418" r="4.4" fill="#d95926"/><text x="68" y="422" font-size="11" font-weight="600" text-anchor="start" letter-spacing="0.6"><tspan fill="#c3c2b7">CONJECTURE</tspan><tspan dx="5" fill="#898781" font-weight="400">· exact at n = 2</tspan></text><text x="52" y="451" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">Soft theorem</text><text x="52" y="479" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="start"><tspan font-size="13.5">∂</tspan><tspan dy="4.05" font-size="10.8">k</tspan><tspan font-size="10.8">s</tspan><tspan dx="3.91" dy="-4.05" font-size="13.5">δ</tspan><tspan dy="4.05" font-size="10.8">phys</tspan><tspan dx="3.91" dy="-4.05" font-size="13.5">|</tspan><tspan dy="4.05" font-size="10.8">0</tspan><tspan dx="3.91" dy="-4.05" font-size="13.5">= sgn(v</tspan><tspan dy="4.05" font-size="10.8">h</tspan><tspan dx="3.91" dy="-4.05" font-size="13.5">− v</tspan><tspan dy="4.05" font-size="10.8">s</tspan><tspan dy="-4.05" font-size="13.5">) / S</tspan></text><text x="52" y="503" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">empirically confirmed · proof under review</text>
<rect x="580" y="396" width="290" height="150" rx="10" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/><text x="850" y="450" font-size="54" font-weight="700" fill="rgba(255,255,255,0.10)" text-anchor="end">B</text><circle cx="606" cy="418" r="4.4" fill="#0ca30c"/><text x="618" y="422" font-size="11" font-weight="600" text-anchor="start" letter-spacing="0.6"><tspan fill="#c3c2b7">PROVED</tspan><tspan dx="5" fill="#898781" font-weight="400">· conditional (D26, D27)</tspan></text><text x="602" y="451" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">Memory effect</text><text x="602" y="479" font-size="13.5" font-weight="400" fill="#c3c2b7" text-anchor="start"><tspan font-size="13.5">δx = −(2s)</tspan><tspan dy="-5.67" font-size="10.8">−1</tspan><tspan dx="3.91" dy="5.67" font-size="13.5">Σ</tspan><tspan dy="4.05" font-size="10.8">ν</tspan><tspan dx="3.91" dy="-4.05" font-size="13.5">ν p</tspan><tspan dy="4.05" font-size="10.8">ν</tspan><tspan dx="15.66" dy="-4.05" font-size="13.5">·    ν ∈ Z</tspan></text><text x="602" y="503" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">channel-free · needs no scattering input</text>
<text x="272" y="302" font-size="13" font-weight="600" fill="#ffffff" text-anchor="end">A ⇒ C</text>
<circle cx="282" cy="319" r="4.2" fill="#d95926"/>
<text x="272" y="323" font-size="11" font-weight="600" text-anchor="end" letter-spacing="0.5"><tspan fill="#c3c2b7">CONJECTURE</tspan><tspan dx="5" fill="#898781" font-weight="400">· ML1, ML3, ML6 open</tspan></text>
<text x="628" y="302" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">B ⇒ A</text>
<circle cx="618" cy="319" r="4.2" fill="#3987e5"/>
<text x="628" y="323" font-size="11" font-weight="600" text-anchor="start" letter-spacing="0.5"><tspan fill="#c3c2b7">SKETCH</tspan><tspan dx="5" fill="#898781" font-weight="400">· awaiting the moment map</tspan></text>
<text x="450" y="432" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">C ⇒ B</text>
<circle cx="345" cy="449" r="4.2" fill="#3987e5"/>
<text x="357" y="453" font-size="11" font-weight="600" text-anchor="start" letter-spacing="0.5"><tspan fill="#c3c2b7">SKETCH</tspan><tspan dx="5" fill="#898781" font-weight="400">· blocked on lemma ACE-LD</tspan></text>
<line x1="30" y1="574" x2="870" y2="574" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
<circle cx="211" cy="596" r="4.2" fill="#0ca30c"/>
<text x="223" y="600" font-size="11" font-weight="600" text-anchor="start" letter-spacing="0.5"><tspan fill="#c3c2b7">PROVED</tspan></text>
<circle cx="311" cy="596" r="4.2" fill="#3987e5"/>
<text x="323" y="600" font-size="11" font-weight="600" text-anchor="start" letter-spacing="0.5"><tspan fill="#c3c2b7">SKETCH</tspan><tspan dx="5" fill="#898781" font-weight="400">— conditional or partial</tspan></text>
<circle cx="559" cy="596" r="4.2" fill="#d95926"/>
<text x="571" y="600" font-size="11" font-weight="600" text-anchor="start" letter-spacing="0.5"><tspan fill="#c3c2b7">CONJECTURE</tspan><tspan dx="5" fill="#898781" font-weight="400">— open</tspan></text>
<text x="450" y="630" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="middle" font-style="italic">symmetry quantizes; the ansatz supplies the kinematics; dynamics only picks the values.</text>
<text x="450" y="652" font-size="11" font-weight="400" fill="#898781" text-anchor="middle">statuses verbatim from claims/CLAIMS.md · edges from theory/TRIANGLE.md §6</text>
